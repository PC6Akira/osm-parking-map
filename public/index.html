<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>停车场车位地图管理系统</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🅿️ OSM 停车场车位地图管理系统<span class="sub">专业课程设计II · 题目2</span></div>
    <div class="stats" id="stats">加载中…</div>
    <div class="actions">
      <span class="user-info" id="user-info"></span>
      <a class="btn ghost" href="admin.html">管理后台</a>
      <button class="btn" id="btn-locate">📍 我的位置</button>
      <button class="btn ghost" id="btn-logout">退出</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h3>车位搜索</h3>
        <label>状态</label>
        <select id="f-status">
          <option value="">全部</option>
          <option value="free">空闲</option>
          <option value="occupied">占用</option>
          <option value="reserved">已预约</option>
          <option value="disabled">停用</option>
        </select>
        <label>停车场</label>
        <select id="f-lot"><option value="">全部</option></select>
        <label>关键字（车位号 / 停车场名）</label>
        <input id="f-q" type="text" placeholder="如 A-01 或 图书馆">
        <div class="row">
          <button class="btn primary" id="btn-search">搜索</button>
          <button class="btn ghost" id="btn-reset">重置</button>
        </div>
      </section>

      <section class="panel">
        <h3>附近空闲车位</h3>
        <label>搜索半径</label>
        <div class="row">
          <input id="f-radius" type="number" value="500" min="50" step="50">
          <span class="unit">米</span>
        </div>
        <button class="btn primary" id="btn-nearby">查找附近空闲车位</button>
        <p class="hint">基于浏览器定位；localhost 下可正常使用，局域网 IP 需 HTTPS。</p>
      </section>

      <section class="panel list-panel">
        <h3>结果 <span id="list-count" class="badge">0</span></h3>
        <ul id="result-list" class="result-list"></ul>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="nav-bar" class="nav-bar hidden">
        <span id="nav-info"></span>
        <button class="btn small" id="btn-clear-route">清除路线</button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
